<script>

let monitorTimer =

let firstReceiverLoad =

const sendText =
  document.getElementById(
    'sendText'
  );

const sendStatus =
  document.getElementById(
    'sendStatus'
  );

const sendCount =
  document.getElementById(
    'sendCount'
  );

const receiverText =
  document.getElementById(
    'receiverText'
  );

const receiveStatus =
  document.getElementById(
    'receiveStatus'
  );


function setSendStatus(text) {

  sendStatus.textContent =
    text;
}


function setReceiveStatus(text) {

  receiveStatus.textContent =
    text;
}


function updateSendCount() {

  sendCount.textContent =
    sendText.value.length
      .toLocaleString()
    +
    '자';
}


sendText.addEventListener(
  'input',
  updateSendCount
);


function loadSettings() {

  document.getElementById(
    'owner'
  ).value =
    localStorage.getItem(
      'githubOwner'
    ) || 'joo-ec';


  document.getElementById(
    'repo'
  ).value =
    localStorage.getItem(
      'githubRepo'
    ) || 'gpt-to-pc-data';


  document.getElementById(
    'branch'
  ).value =
    localStorage.getItem(
      'githubBranch'
    ) || 'main';


  document.getElementById(
    'sendPath'
  ).value =
    localStorage.getItem(
      'githubPath'
    ) || 'inbox/latest.ps1';


  document.getElementById(
    'token'
  ).value =
    localStorage.getItem(
      'githubToken'
    ) || '';
}


function saveSettings() {

  const owner =
    document
      .getElementById('owner')
      .value
      .trim();

  const repo =
    document
      .getElementById('repo')
      .value
      .trim();

  const branch =
    document
      .getElementById('branch')
      .value
      .trim();

  const path =
    document
      .getElementById('sendPath')
      .value
      .trim();

  const token =
    document
      .getElementById('token')
      .value
      .trim();


  localStorage.setItem(

  );


  if (

  ) {

      '설정을 저장했습니다.\n연결 확인 중...'
    );

    checkLatestFile(
      true
    );

  } else {

}


function getSettings() {

  const settings = {

    owner:
      document
        .getElementById('owner')
        .value
        .trim(),

    repo:
      document
        .getElementById('repo')
        .value
        .trim(),

    branch:
      document
        .getElementById('branch')
        .value
        .trim(),

    path:
      document
        .getElementById('sendPath')
        .value
        .trim(),

    token:
      document
        .getElementById('token')
        .value
        .trim()
  };


  if (!settings.owner) {
    throw new Error(
      'GitHub 사용자명이 없습니다.'
    );
  }

  if (!settings.repo) {
    throw new Error(
      'Repository가 없습니다.'
    );
  }

  if (!settings.branch) {
    throw new Error(
      'Branch가 없습니다.'
    );
  }

  if (!settings.path) {
    throw new Error(
      '파일 경로가 없습니다.'
    );
  }

  if (!settings.token) {
    throw new Error(
      'GitHub PAT를 입력하세요.'
    );
  }


  return settings;
}


function headers(token) {

  return {

    'Accept':
      'application/vnd.github+json',

    'Authorization':
      'Bearer ' + token,

    'X-GitHub-Api-Version':
      API_VERSION
  };
}


function apiUrl(
  owner,
  repo,
  path
) {

  const encodedPath =
    path
      .split('/')
      .map(
        value =>
          encodeURIComponent(
            value
          )
      )
      .join('/');


  return (
    'https://api.github.com/repos/' +
    encodeURIComponent(owner) +
    '/' +
    encodeURIComponent(repo) +
    '/contents/' +
    encodedPath
  );
}


function utf8ToBase64(text) {

  const bytes =
    new TextEncoder()
      .encode(
        text
      );


  let binary =
    '';


  const size =
    0x8000;


  for (
    let i = 0;
    i < bytes.length;
    i += size
  ) {

    const chunk =
      bytes.subarray(
        i,
        Math.min(
          i + size,
          bytes.length
        )
      );


    binary +=
      String.fromCharCode.apply(
        null,
        chunk
      );
  }


  return btoa(
    binary
  );
}


function base64ToUtf8(value) {

  const cleaned =
    String(value || '')
      .replace(
        /\s/g,
        ''
      );


  const binary =
    atob(
      cleaned
    );


  const bytes =
    new Uint8Array(
      binary.length
    );


  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(
        i
      );
  }


  return new TextDecoder(
    'utf-8'
  ).decode(
    bytes
  );
}

async function readClipboard() {

  try {

    if (
      !navigator.clipboard ||
      !navigator.clipboard.readText
    ) {

      throw new Error(
        '클립보드 읽기를 지원하지 않습니다.'
      );
    }


    const text =
      await navigator
        .clipboard
        .readText();


    if (!text) {

      throw new Error(
        '클립보드가 비어 있습니다.'
      );
    }


    sendText.value =
      text;


    updateSendCount();


    setSendStatus(
      '클립보드 읽기 완료\n' +
      text.length.toLocaleString() +
      '자'
    );


    return text;

  } catch (error) {

    setSendStatus(
      '클립보드 읽기 실패\n\n' +
      error.message
    );

    throw error;
  }
}


async function clipboardAndSend() {

  try {

    const text =
      await readClipboard();


    await sendToGitHub(
      text
    );

  } catch (error) {

    if (
      !String(
        error.message
      ).includes(
        '클립보드'
      )
    ) {

      setSendStatus(
        '전송 실패\n\n' +
        error.message
      );
    }
  }
}

  } catch (error) {

    );
  }
}


function waitMs(ms) {

  return new Promise(
    resolve => {
      setTimeout(
        resolve,
        ms
      );
    }
  );
}


async function readGitHubResponseError(
  response
) {

  let message =
    response.status +
    ' ' +
    response.statusText;


  try {

    const body =
      await response.json();


    if (
      body &&
      body.message
    ) {

      message =
        body.message;
    }

  } catch {
  }


  return message;
}


async function getLatestGitHubFileSha(
  s,
  url
) {

  const response =
    await fetch(
      url +
      '?ref=' +
      encodeURIComponent(
        s.branch
      ) +
      '&_=' +
      Date.now(),
      {
        method:
          'GET',

        cache:
          'no-store',

        headers:
          headers(
            s.token
          )
      }
    );


  if (
    response.status === 404
  ) {

    return null;
  }


  if (!response.ok) {

    const detail =
      await readGitHubResponseError(
        response
      );


    throw new Error(
      'GitHub 파일 확인 실패: ' +
      detail
    );
  }


  const data =
    await response.json();


  return (
    data.sha ||
    null
  );
}


function isGitHubShaConflict(
  statusCode,
  message
) {

  const text =
    String(
      message || ''
    ).toLowerCase();


  return (
    statusCode === 409 ||
    statusCode === 422 ||
    text.includes(
      'does not match'
    ) ||
    (
      text.includes(
        'sha'
      ) &&
      text.includes(
        'match'
      )
    )
  );
}


async function sendToGitHub(text) {

  const s =
    getSettings();


  localStorage.setItem(
    'githubPath',
    s.path
  );


  const url =
    apiUrl(
      s.owner,
      s.repo,
      s.path
    );


  const maxAttempts =
    5;


  let lastError =
    null;


  for (
    let attempt = 1;
    attempt <= maxAttempts;
    attempt++
  ) {

    try {

      setSendStatus(
        'GitHub 최신 상태 확인 중...\n\n' +
        '전송 시도 ' +
        attempt +
        '/' +
        maxAttempts
      );


      // ------------------------------------------------------
      // 핵심:
      // 매 PUT 직전에 항상 최신 SHA를 다시 읽는다.
      // ------------------------------------------------------

      const currentSha =
        await getLatestGitHubFileSha(
          s,
          url
        );


      const body = {

        message:
          'GPT to PC ' +
          new Date()
            .toISOString(),

        content:
          utf8ToBase64(
            text
          ),

        branch:
          s.branch
      };


      if (currentSha) {

        body.sha =
          currentSha;
      }


      setSendStatus(
        'PC로 전송 중...\n\n' +
        text.length.toLocaleString() +
        '자\n\n' +
        '시도 ' +
        attempt +
        '/' +
        maxAttempts
      );


      const response =
        await fetch(
          url,
          {
            method:
              'PUT',

            cache:
              'no-store',

            headers: {

              ...headers(
                s.token
              ),

              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify(
                body
              )
          }
        );


      // ------------------------------------------------------
      // 성공
      // ------------------------------------------------------

      if (response.ok) {

        const result =
          await response.json();


        let message =
          'PC 전송 완료!\n\n' +
          s.path +
          '\n' +
          text.length.toLocaleString() +
          '자\n\n' +
          'Commit: ' +
          result.commit.sha.substring(
            0,
            7
          );


        if (attempt > 1) {

          message +=
            '\n\nGitHub 충돌 자동 복구 완료' +
            '\n' +
            attempt +
            '회차에 성공';
        }


        setSendStatus(
          message
        );


        return result;
      }


      // ------------------------------------------------------
      // 실패 내용 읽기
      // ------------------------------------------------------

      const detail =
        await readGitHubResponseError(
          response
        );


      const conflict =
        isGitHubShaConflict(
          response.status,
          detail
        );


      // ------------------------------------------------------
      // SHA 충돌이면 최신 SHA를 다시 읽고 재시도
      // ------------------------------------------------------

      if (
        conflict &&
        attempt < maxAttempts
      ) {

        lastError =
          new Error(
            detail
          );


        setSendStatus(
          'GitHub 동시 수정 충돌 감지\n\n' +
          detail +
          '\n\n' +
          '최신 SHA를 다시 읽은 뒤 자동 재시도합니다.\n' +
          '시도 ' +
          attempt +
          '/' +
          maxAttempts
        );


        // PC Runner가 result/*를 쓰는 순간과 겹칠 수 있으므로
        // 재시도할수록 조금 더 기다린다.
        await waitMs(
          400 * attempt
        );


        continue;
      }


      // SHA 충돌이 아닌 실제 오류
      throw new Error(
        detail
      );


    } catch (error) {

      lastError =
        error;


      const message =
        String(
          error &&
          error.message
            ? error.message
            : error
        );


      const retryable =
        isGitHubShaConflict(
          0,
          message
        ) ||
        message
          .toLowerCase()
          .includes(
            'failed to fetch'
          );


      if (
        retryable &&
        attempt < maxAttempts
      ) {

        setSendStatus(
          '일시적인 GitHub 충돌/통신 오류\n\n' +
          message +
          '\n\n' +
          '자동 재시도합니다.\n' +
          '시도 ' +
          attempt +
          '/' +
          maxAttempts
        );


        await waitMs(
          500 * attempt
        );


        continue;
      }


      throw error;
    }
  }


  throw (
    lastError ||
    new Error(
      'GitHub 전송을 완료하지 못했습니다.'
    )
  );
}

async function checkLatestFile(
  manual
) {

  try {

    const s =
      getSettings();


    const url =
      apiUrl(
        s.owner,
        s.repo,
        s.path
      );


    if (
      manual ||
      firstReceiverLoad
    ) {

      setReceiveStatus(
        'GitHub 확인 중...'
      );
    }


    const response =
      await fetch(
        url +
        '?ref=' +
        encodeURIComponent(
          s.branch
        ) +
        '&_=' +
        Date.now(),
        {
          cache:
            'no-store',

          headers:
            headers(
              s.token
            )
        }
      );


    if (!response.ok) {

      throw new Error(
        'GitHub 응답 ' +
        response.status
      );
    }


    const data =
      await response.json();


    const changed =
      data.sha !== lastSha;


    if (
      changed ||
      firstReceiverLoad
    ) {

      const text =
        base64ToUtf8(
          data.content
        );


      receiverText.value =
        text;


      document.getElementById(
        'receiveFile'
      ).textContent =
        data.path;


      document.getElementById(
        'receiveLength'
      ).textContent =
        text.length
          .toLocaleString()
        +
        '자';


      document.getElementById(
        'receiveTime'
      ).textContent =
        new Date()
          .toLocaleTimeString();


      if (
        !firstReceiverLoad &&
        changed
      ) {

        setReceiveStatus(
          '● 새 코드 도착!\n' +
          new Date()
            .toLocaleString()
        );


        const card =
          document.getElementById(
            'receiverCard'
          );


        card.classList.remove(
          'newFlash'
        );


        void card.offsetWidth;


        card.classList.add(
          'newFlash'
        );


        try {

          if (
            'Notification' in window &&
            Notification.permission ===
              'granted'
          ) {

            new Notification(
              'GPT → PC',
              {
                body:
                  '새 코드가 도착했습니다.'
              }
            );
          }

        } catch {
        }


      } else {

        setReceiveStatus(
          '● 연결됨\n' +
          '5초마다 자동 확인'
        );
      }


      lastSha =
        data.sha;


      firstReceiverLoad =
        false;


    } else {

      setReceiveStatus(
        '● 연결됨\n' +
        '새 코드 대기 중\n' +
        new Date()
          .toLocaleTimeString()
      );
    }


  } catch (error) {

    setReceiveStatus(
      '연결 오류\n\n' +
      error.message +
      '\n\nGitHub 연결 설정을 확인하세요.'
    );


    document.getElementById(
      'settingsDetails'
    ).open =
      true;
  }
}


async function copyReceiverText() {

  const text =

  if (!text) {

    setReceiveStatus(

    sendPath.value =
      path;


    sendPath.readOnly =
      true;


    localStorage.setItem(
      'githubPath',
      path
    );
  }


  userInput.addEventListener(
    'change',
    updatePath
  );


  userInput.addEventListener(
    'blur',
    updatePath
  );


  updatePath();


  // 기존 saveSettings에 User ID 저장 기능 추가
  if (
    typeof window.saveSettings ===
    'function'
  ) {

    const originalSaveSettings =
      window.saveSettings;


    window.saveSettings =
      function () {

        updatePath();

        return originalSaveSettings();
      };
  }


  // result.html로 이동할 때 User ID도 localStorage로 공유됨
  const resultLink =
    Array
      .from(
        document.querySelectorAll(
          'a'
        )
      )
      .find(
        item =>
          String(
            item.getAttribute(
              'href'
            ) || ''
          ).includes(
            'result.html'
          )
      );


  if (resultLink) {

    resultLink.addEventListener(
      'click',
      updatePath
    );
  }

})();

</script>

<script>

(function () {

  const TEXT_POLL_MS =
    5000;

  let textMonitorTimer =
    null;

  let lastIncomingSha =
    '';


  // =========================================================
  // HELPERS
  // =========================================================

  function byId(id) {

    return document.getElementById(
      id
    );
  }


  function cleanUserId(value) {

    return String(
      value || ''
    )
      .trim()
      .toLowerCase()
      .replace(
        /[^a-z0-9._-]/g,
        '-'
      )
      .replace(
        /-+/g,
        '-'
      )
      .replace(
        /^[-.]+|[-.]+$/g,
        ''
      );
  }


  function defaultRole() {

    const mobile =
      /Android|iPhone|iPad|Mobile/i
        .test(
          navigator.userAgent
        );

    return mobile
      ? 'phone'
      : 'pc';
  }


  function getRole() {

    return (
      localStorage.getItem(
        'bridgeDeviceRole'
      ) ||
      defaultRole()
    );
  }


  function setRole(role) {

    localStorage.setItem(
      'bridgeDeviceRole',
      role
    );

    updateRoleUi();

    loadIncomingText(
      true
    );
  }


  function getUserId() {

    const input =
      byId(
        'bridgeUserId'
      );

    let value =
      input
        ? input.value
        : localStorage.getItem(
            'bridgeUserId'
          );


    value =
      cleanUserId(
        value
      );


    if (!value) {

      value =
        'user1';
    }


    localStorage.setItem(
      'bridgeUserId',
      value
    );


    return value;
  }


  function getTextSettings() {

    const owner =
      byId('owner')
        ? byId('owner').value.trim()
        : localStorage.getItem(
            'githubOwner'
          ) || 'joo-ec';


    const repo =
      byId('repo')
        ? byId('repo').value.trim()
        : localStorage.getItem(
            'githubRepo'
          ) || 'gpt-to-pc-data';


    const branch =
      byId('branch')
        ? byId('branch').value.trim()
        : localStorage.getItem(
            'githubBranch'
          ) || 'main';


    const token =
      byId('token')
        ? byId('token').value.trim()
        : localStorage.getItem(
            'githubToken'
          ) || '';


    if (!owner) {

      throw new Error(
        'GitHub 사용자명이 없습니다.'
      );
    }


    if (!repo) {

      throw new Error(
        'Repository가 없습니다.'
      );
    }


    if (!branch) {

      throw new Error(
        'Branch가 없습니다.'
      );
    }


    if (!token) {

      throw new Error(
        'GitHub PAT가 없습니다.'
      );
    }


    return {
      owner,
      repo,
      branch,
      token,
      userId:
        getUserId(),
      role:
        getRole()
    };
  }


  function textHeaders(token) {

    return {

      Accept:
        'application/vnd.github+json',

      Authorization:
        'Bearer ' + token,

      'X-GitHub-Api-Version':
        '2022-11-28'
    };
  }


  function textApiUrl(
    settings,
    path
  ) {

    return (
      'https://api.github.com/repos/' +
      encodeURIComponent(
        settings.owner
      ) +
      '/' +
      encodeURIComponent(
        settings.repo
      ) +
      '/contents/' +
      path
        .split('/')
        .map(
          encodeURIComponent
        )
        .join('/')
    );
  }


  function outgoingPath(settings) {

    if (
      settings.role ===
      'phone'
    ) {

      return (
        'users/' +
        settings.userId +
        '/text/phone-to-pc.txt'
      );
    }


    return (
      'users/' +
      settings.userId +
      '/text/pc-to-phone.txt'
    );
  }


  function incomingPath(settings) {

    if (
      settings.role ===
      'phone'
    ) {

      return (
        'users/' +
        settings.userId +
        '/text/pc-to-phone.txt'
      );
    }


    return (
      'users/' +
      settings.userId +
      '/text/phone-to-pc.txt'
    );
  }


  function textUtf8ToBase64(text) {

    const bytes =
      new TextEncoder()
        .encode(text);


    let binary =
      '';


    const chunk =
      0x8000;


    for (
      let i = 0;
      i < bytes.length;
      i += chunk
    ) {

      binary +=
        String.fromCharCode.apply(
          null,
          bytes.subarray(
            i,
            i + chunk
          )
        );
    }


    return btoa(binary);
  }


  function textBase64ToUtf8(value) {

    const binary =
      atob(
        String(value || '')
          .replace(/\s/g, '')
      );


    const bytes =
      new Uint8Array(
        binary.length
      );


    for (
      let i = 0;
      i < binary.length;
      i++
    ) {

      bytes[i] =
        binary.charCodeAt(i);
    }


    return new TextDecoder(
      'utf-8'
    ).decode(bytes);
  }


  function setTextStatus(text) {

    const target =
      byId(
        'gptTextStatus'
      );


    if (target) {

      target.textContent =
        text;
    }
  }


  function waitText(ms) {

    return new Promise(
      resolve =>
        setTimeout(
          resolve,
          ms
        )
    );
  }


  // =========================================================
  // GITHUB FILE
  // =========================================================

  async function getGitHubTextFile(
    settings,
    path
  ) {

    const response =
      await fetch(
        textApiUrl(
          settings,
          path
        ) +
        '?ref=' +
        encodeURIComponent(
          settings.branch
        ) +
        '&_=' +
        Date.now(),
        {
          cache:
            'no-store',

          headers:
            textHeaders(
              settings.token
            )
        }
      );


    if (
      response.status === 404
    ) {

      return null;
    }


    if (!response.ok) {

      throw new Error(
        'GitHub 조회 실패: ' +
        response.status
      );
    }


    return await response.json();
  }


  async function putGitHubTextFile(
    settings,
    path,
    text
  ) {

    const url =
      textApiUrl(
        settings,
        path
      );


    let lastError =
      null;


    for (
      let attempt = 1;
      attempt <= 5;
      attempt++
    ) {

      try {

        let sha =
          null;


        const existing =
          await getGitHubTextFile(
            settings,
            path
          );


        if (existing) {

          sha =
            existing.sha;
        }


        const body = {

          message:
            'GPT Text Bridge ' +
            settings.userId +
            ' ' +
            new Date()
              .toISOString(),

          content:
            textUtf8ToBase64(
              text
            ),

          branch:
            settings.branch
        };


        if (sha) {

          body.sha =
            sha;
        }


        const response =
          await fetch(
            url,
            {
              method:
                'PUT',

              cache:
                'no-store',

              headers: {

                ...textHeaders(
                  settings.token
                ),

                'Content-Type':
                  'application/json'
              },

              body:
                JSON.stringify(
                  body
                )
            }
          );


        if (response.ok) {

          return await response.json();
        }


        let detail =
          response.status +
          ' ' +
          response.statusText;


        try {

          const error =
            await response.json();


          if (error.message) {

            detail =
              error.message;
          }

        } catch {
        }


        const lower =
          detail.toLowerCase();


        const retry =
          response.status === 409 ||
          response.status === 422 ||
          lower.includes(
            'does not match'
          );


        if (
          retry &&
          attempt < 5
        ) {

          await waitText(
            400 * attempt
          );

          continue;
        }


        throw new Error(
          detail
        );

      } catch (error) {

        lastError =
          error;


        if (attempt >= 5) {

          throw error;
        }


        await waitText(
          500 * attempt
        );
      }
    }


    throw (
      lastError ||
      new Error(
        '텍스트 전송 실패'
      )
    );
  }


  // =========================================================
  // SEND
  // =========================================================

  async function sendTextCurrent() {

    try {

      const settings =
        getTextSettings();


      const textarea =
        byId(
          'gptTextSend'
        );


      const text =
        textarea.value;


      if (!text) {

        throw new Error(
          '전송할 텍스트가 없습니다.'
        );
      }


      const path =
        outgoingPath(
          settings
        );


      setTextStatus(
        '텍스트 전송 중...\n' +
        path +
        '\n' +
        text.length.toLocaleString() +
        '자'
      );


      await putGitHubTextFile(
        settings,
        path,
        text
      );


      setTextStatus(
        '✅ 텍스트 전송 완료\n\n' +
        (
          settings.role ===
          'phone'
            ? '휴대폰 → PC'
            : 'PC → 휴대폰'
        ) +
        '\n' +
        text.length.toLocaleString() +
        '자'
      );

    } catch (error) {

      setTextStatus(
        '❌ 텍스트 전송 실패\n\n' +
        error.message
      );
    }
  }


  async function clipboardToText() {

    try {

      if (
        !navigator.clipboard ||
        !navigator.clipboard.readText
      ) {

        throw new Error(
          '이 브라우저에서는 클립보드 읽기를 지원하지 않습니다.'
        );
      }


      const text =
        await navigator
          .clipboard
          .readText();


      if (!text) {

        throw new Error(
          '클립보드가 비어 있습니다.'
        );
      }


      byId(
        'gptTextSend'
      ).value =
        text;


      setTextStatus(
        '클립보드 읽기 완료\n' +
        text.length.toLocaleString() +
        '자'
      );

    } catch (error) {

      setTextStatus(
        '클립보드 읽기 실패\n\n' +
        error.message
      );
    }
  }


  async function clipboardAndSendText() {

    await clipboardToText();


    if (
      byId('gptTextSend')
        .value
    ) {

      await sendTextCurrent();
    }
  }


  // =========================================================
  // RECEIVE
  // =========================================================

  async function loadIncomingText(
    manual
  ) {

    try {

      const settings =
        getTextSettings();


      const path =
        incomingPath(
          settings
        );


      if (manual) {

        setTextStatus(
          '상대방 텍스트 확인 중...\n' +
          path
        );
      }


      const file =
        await getGitHubTextFile(
          settings,
          path
        );


      if (!file) {

        if (manual) {

          setTextStatus(
            '아직 상대방이 보낸 텍스트가 없습니다.'
          );
        }


        return;
      }


      const changed =
        file.sha !==
        lastIncomingSha;


      if (
        changed ||
        manual
      ) {

        const text =
          textBase64ToUtf8(
            file.content
          );


        byId(
          'gptTextReceive'
        ).value =
          text;


        lastIncomingSha =
          file.sha;


        setTextStatus(
          (
            changed
              ? '📩 새 텍스트 수신'
              : '✅ 최신 텍스트 확인'
          ) +
          '\n\n' +
          (
            settings.role ===
            'phone'
              ? 'PC → 휴대폰'
              : '휴대폰 → PC'
          ) +
          '\n' +
          text.length.toLocaleString() +
          '자\n' +
          new Date()
            .toLocaleTimeString()
        );
      }

    } catch (error) {

      if (manual) {

        setTextStatus(
          '텍스트 수신 실패\n\n' +
          error.message
        );
      }
    }
  }


  async function copyIncomingText() {

    const text =
      byId(
        'gptTextReceive'
      ).value;


    if (!text) {

      alert(
        '복사할 수신 텍스트가 없습니다.'
      );

      return;
    }


    try {

      await navigator
        .clipboard
        .writeText(text);


      setTextStatus(
        '수신 텍스트를 클립보드에 복사했습니다.'
      );

    } catch {

      const box =
        byId(
          'gptTextReceive'
        );


      box.focus();
      box.select();


      setTextStatus(
        '자동 복사가 제한되었습니다.\nCtrl+C 또는 복사를 사용하세요.'
      );
    }
  }


  // =========================================================
  // UI
  // =========================================================

  function updateRoleUi() {

    const role =
      getRole();


    const phone =
      byId(
        'gptTextRolePhone'
      );


    const pc =
      byId(
        'gptTextRolePc'
      );


    if (!phone || !pc) {
      return;
    }


    phone.className =
      role === 'phone'
        ? 'selected'
        : 'unselected';


    pc.className =
      role === 'pc'
        ? 'selected'
        : 'unselected';


    const settings =
      {
        role,
        userId:
          getUserId()
      };


    const info =
      byId(
        'gptTextPathInfo'
      );


    if (info) {

      info.textContent =
        '보내는 경로\n' +
        outgoingPath(
          settings
        ) +
        '\n\n받는 경로\n' +
        incomingPath(
          settings
        );
    }
  }


  function showTextMode() {

    const sendMode =
      byId(
        'sendMode'
      );

    const receiveMode =
      byId(
        'receiveMode'
      );

    const textMode =
      byId(
        'gptTextMode'
      );


    if (sendMode) {

      sendMode.classList.add(
        'hidden'
      );
    }


    if (receiveMode) {

      receiveMode.classList.add(
        'hidden'
      );
    }


    textMode.classList.add(
      'gpt-text-visible'
    );


    const sendButton =
      byId(
        'sendModeButton'
      );

    const receiveButton =
      byId(
        'receiveModeButton'
      );

    const textButton =
      byId(
        'gptTextModeButton'
      );


    if (sendButton) {

      sendButton.className =
        'inactive';
    }


    if (receiveButton) {

      receiveButton.className =
        'inactive';
    }


    textButton.className =
      'active';


    const subtitle =
      byId(
        'subtitle'
      );


    if (subtitle) {

      subtitle.textContent =
        '휴대폰과 PC 사이에서 클립보드 텍스트를 양방향으로 전달합니다.';
    }


    const url =
      new URL(
        location.href
      );


    url.searchParams.set(
      'mode',
      'text'
    );


    history.replaceState(
      {},
      '',
      url
    );


    updateRoleUi();

    loadIncomingText(
      true
    );


    if (textMonitorTimer) {

      clearInterval(
        textMonitorTimer
      );
    }


    textMonitorTimer =
      setInterval(
        () => {

          if (
            byId('gptTextMode')
              .classList
              .contains(
                'gpt-text-visible'
              )
          ) {

            loadIncomingText(
              false
            );
          }

        },
        TEXT_POLL_MS
      );
  }


  // =========================================================
  // 기존 탭 동작과 연결
  // =========================================================

  const originalSetMode =
    window.setMode;


  if (
    typeof originalSetMode ===
    'function'
  ) {

    window.setMode =
      function (mode) {

        const textMode =
          byId(
            'gptTextMode'
          );


        if (textMode) {

          textMode.classList.remove(
            'gpt-text-visible'
          );
        }


        const textButton =
          byId(
            'gptTextModeButton'
          );


        if (textButton) {

          textButton.className =
            'inactive';
        }


        return originalSetMode(
          mode
        );
      };
  }


  // =========================================================
  // 탭 버튼 추가
  // =========================================================

  const modeBar =
    document.querySelector(
      '.modebar'
    );


  if (!modeBar) {
    return;
  }


  const textButton =
    document.createElement(
      'button'
    );


  textButton.id =
    'gptTextModeButton';

  textButton.className =
    'inactive';

  textButton.textContent =
    '텍스트 교환';

  textButton.addEventListener(
    'click',
    showTextMode
  );


  modeBar.appendChild(
    textButton
  );


  // =========================================================
  // Text Mode 화면 생성
  // =========================================================

  const textMode =
    document.createElement(
      'div'
    );


  textMode.id =
    'gptTextMode';


  textMode.innerHTML = `

    <div class="card">

      <label>
        이 기기의 역할
      </label>

      <div class="gpt-text-role">

        <button
          id="gptTextRolePhone"
          type="button"
        >
          📱 휴대폰
        </button>

        <button
          id="gptTextRolePc"
          type="button"
        >
          💻 PC
        </button>

      </div>

      <div
        id="gptTextPathInfo"
        class="gpt-text-info"
      ></div>

    </div>


    <div class="card">

      <label>
        상대방에게 보낼 텍스트
      </label>

      <textarea
        id="gptTextSend"
        class="gpt-text-box"
        placeholder="클립보드를 읽거나 직접 텍스트를 입력하세요."
      ></textarea>


      <button
        id="gptTextClipboardSend"
        class="green"
        type="button"
      >
        클립보드 읽고 바로 전송
      </button>


      <button
        id="gptTextClipboardRead"
        class="blue"
        type="button"
      >
        클립보드만 가져오기
      </button>


      <button
        id="gptTextCurrentSend"
        class="gray"
        type="button"
      >
        현재 텍스트 전송
      </button>


      <button
        id="gptTextClear"
        class="red"
        type="button"
      >
        입력 내용 지우기
      </button>

    </div>


    <div class="card">

      <label>
        상대방에게서 받은 최신 텍스트
      </label>

      <textarea
        id="gptTextReceive"
        class="gpt-text-receive-box"
        readonly
      ></textarea>


      <button
        id="gptTextRefresh"
        class="blue"
        type="button"
      >
        지금 새로고침
      </button>


      <button
        id="gptTextCopy"
        class="green"
        type="button"
      >
        받은 텍스트 클립보드 복사
      </button>

    </div>


    <div class="card">

      <div
        id="gptTextStatus"
        class="gpt-text-status"
      >
        텍스트 교환 준비됨
      </div>

    </div>
  `;


  const receiveMode =
    byId(
      'receiveMode'
    );


  if (receiveMode) {

    receiveMode.insertAdjacentElement(
      'afterend',
      textMode
    );

  } else {

    modeBar.insertAdjacentElement(
      'afterend',
      textMode
    );
  }


  // =========================================================
  // 이벤트
  // =========================================================

  byId(
    'gptTextRolePhone'
  ).addEventListener(
    'click',
    () =>
      setRole(
        'phone'
      )
  );


  byId(
    'gptTextRolePc'
  ).addEventListener(
    'click',
    () =>
      setRole(
        'pc'
      )
  );


  byId(
    'gptTextClipboardRead'
  ).addEventListener(
    'click',
    clipboardToText
  );


  byId(
    'gptTextClipboardSend'
  ).addEventListener(
    'click',
    clipboardAndSendText
  );


  byId(
    'gptTextCurrentSend'
  ).addEventListener(
    'click',
    sendTextCurrent
  );


  byId(
    'gptTextClear'
  ).addEventListener(
    'click',
    () => {

      byId(
        'gptTextSend'
      ).value =
        '';

      setTextStatus(
        '입력 내용을 지웠습니다.'
      );
    }
  );


  byId(
    'gptTextRefresh'
  ).addEventListener(
    'click',
    () =>
      loadIncomingText(
        true
      )
  );


  byId(
    'gptTextCopy'
  ).addEventListener(
    'click',
    copyIncomingText
  );


  updateRoleUi();


  // URL이 ?mode=text 라면 바로 텍스트 탭
  const requestedMode =
    new URLSearchParams(
      location.search
    ).get(
      'mode'
    );


  if (
    requestedMode ===
    'text'
  ) {

    showTextMode();
  }

})();

</script>

<script>

(function () {

  'use strict';


  function byId(id) {

    return document.getElementById(
      id
    );
  }


  function setAccordionOpen(
    card,
    open
  ) {

    if (!card) {
      return;
    }


    if (open) {

      card.classList.add(
        'gpt-open'
      );

    } else {

      card.classList.remove(
        'gpt-open'
      );
    }
  }


  function toggleAccordion(card) {

    if (!card) {
      return;
    }


    card.classList.toggle(
      'gpt-open'
    );
  }


  function createHeader(
    emoji,
    title,
    metaId
  ) {

    const header =
      document.createElement(
        'button'
      );


    header.type =
      'button';


    header.className =
      'gpt-accordion-header';


    const left =
      document.createElement(
        'span'
      );


    left.className =
      'gpt-accordion-left';


    const emojiSpan =
      document.createElement(
        'span'
      );


    emojiSpan.className =
      'gpt-accordion-emoji';


    emojiSpan.textContent =
      emoji;


    const titleSpan =
      document.createElement(
        'span'
      );


    titleSpan.className =
      'gpt-accordion-title';


    titleSpan.textContent =
      title;


    left.appendChild(
      emojiSpan
    );


    left.appendChild(
      titleSpan
    );


    const right =
      document.createElement(
        'span'
      );


    right.className =
      'gpt-accordion-right';


    const meta =
      document.createElement(
        'span'
      );


    meta.id =
      metaId;


    meta.className =
      'gpt-accordion-meta';


    meta.textContent =
      '0자';


    const arrow =
      document.createElement(
        'span'
      );


    arrow.className =
      'gpt-accordion-arrow';


    arrow.textContent =
      '▼';


    right.appendChild(
      meta
    );


    right.appendChild(
      arrow
    );


    header.appendChild(
      left
    );


    header.appendChild(
      right
    );


    return header;
  }


  function convertCardToAccordion(
    card,
    options
  ) {

    if (
      !card ||
      card.dataset.accordionReady ===
      '1'
    ) {

      return null;
    }


    card.dataset.accordionReady =
      '1';


    card.classList.add(
      'gpt-accordion-card'
    );


    const body =
      document.createElement(
        'div'
      );


    body.className =
      'gpt-accordion-body';


    while (
      card.firstChild
    ) {

      body.appendChild(
        card.firstChild
      );
    }


    const header =
      createHeader(
        options.emoji,
        options.title,
        options.metaId
      );


    card.appendChild(
      header
    );


    card.appendChild(
      body
    );


    setAccordionOpen(
      card,
      options.defaultOpen
    );


    header.addEventListener(
      'click',
      function () {

        toggleAccordion(
          card
        );
      }
    );


    return {
      card:
        card,

      header:
        header,

      body:
        body
    };
  }


  function updateMeta(
    textAreaId,
    metaId,
    emptyText
  ) {

    const textarea =
      byId(
        textAreaId
      );


    const meta =
      byId(
        metaId
      );


    if (
      !textarea ||
      !meta
    ) {

      return;
    }


    const length =
      textarea.value.length;


    if (
      length === 0 &&
      emptyText
    ) {

      meta.textContent =
        emptyText;

    } else {

      meta.textContent =
        length.toLocaleString() +
        '자';
    }
  }


  function initialize() {

    const textMode =
      byId(
        'gptTextMode'
      );


    const sendText =
      byId(
        'gptTextSend'
      );


    const receiveText =
      byId(
        'gptTextReceive'
      );


    if (
      !textMode ||
      !sendText ||
      !receiveText
    ) {

      return false;
    }


    if (
      textMode.dataset.accordionV2Ready ===
      '1'
    ) {

      return true;
    }


    textMode.dataset.accordionV2Ready =
      '1';


    const sendCard =
      sendText.closest(
        '.card'
      );


    const receiveCard =
      receiveText.closest(
        '.card'
      );


    if (
      !sendCard ||
      !receiveCard
    ) {

      return false;
    }


    const sendAccordion =
      convertCardToAccordion(
        sendCard,
        {
          emoji:
            '✉️',

          title:
            '상대방에게 보낼 텍스트',

          metaId:
            'gptTextSendAccordionMeta',

          defaultOpen:
            true
        }
      );


    const receiveAccordion =
      convertCardToAccordion(
        receiveCard,
        {
          emoji:
            '📥',

          title:
            '상대방에게서 받은 최신 텍스트',

          metaId:
            'gptTextReceiveAccordionMeta',

          defaultOpen:
            false
        }
      );


    updateMeta(
      'gptTextSend',
      'gptTextSendAccordionMeta',
      '0자'
    );


    updateMeta(
      'gptTextReceive',
      'gptTextReceiveAccordionMeta',
      '대기 중'
    );


    sendText.addEventListener(
      'input',
      function () {

        updateMeta(
          'gptTextSend',
          'gptTextSendAccordionMeta',
          '0자'
        );
      }
    );


    let previousReceiveValue =
      receiveText.value;


    // 기존 Text Bridge 코드가 textarea.value를 직접 변경하므로
    // 값 변경을 주기적으로 감지
    window.setInterval(
      function () {

        updateMeta(
          'gptTextSend',
          'gptTextSendAccordionMeta',
          '0자'
        );


        const currentValue =
          receiveText.value;


        if (
          currentValue !==
          previousReceiveValue
        ) {

          const hadPreviousText =
            previousReceiveValue.length >
            0;


          previousReceiveValue =
            currentValue;


          updateMeta(
            'gptTextReceive',
            'gptTextReceiveAccordionMeta',
            '대기 중'
          );


          // 새 수신 내용이 실제로 들어왔으면 자동 펼침
          if (
            currentValue.length >
            0
          ) {

            setAccordionOpen(
              receiveAccordion
                ? receiveAccordion.card
                : receiveCard,
              true
            );


            // 새 수신 시 보내기 영역은 자동 접어서
            // 받은 내용을 바로 보기 쉽게 함
            if (
              sendAccordion &&
              hadPreviousText
            ) {

              setAccordionOpen(
                sendAccordion.card,
                false
              );
            }
          }
        }

      },
      500
    );


    return true;
  }


  // Text Bridge DOM이 기존 스크립트에서 생성되므로
  // 생성 완료까지 짧게 확인
  let attempts =
    0;


  const timer =
    window.setInterval(
      function () {

        attempts++;


        if (
          initialize() ||
          attempts > 100
        ) {

          window.clearInterval(
            timer
          );
        }

      },
      100
    );

})();

</script>
