<!doctype html>
<html lang="ko">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#111827">

<link
  rel="manifest"
  href="./manifest.webmanifest"
>

<title>GPT → PC</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 14px;
  background: #111827;
  color: #f9fafb;
  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
}

.wrap {
  width: 100%;
  max-width: 1100px;
  margin: auto;
}

h1 {
  margin: 3px 0;
  font-size: 27px;
}

.sub {
  margin: 0 0 16px;
  color: #9ca3af;
}

.modebar {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}

.card {
  margin-bottom: 12px;
  padding: 14px;
  border: 1px solid #374151;
  border-radius: 14px;
  background: #1f2937;
}

label {
  display: block;
  margin: 10px 0 5px;
  color: #9ca3af;
  font-size: 13px;
}

input,
textarea,
button {
  width: 100%;
  border-radius: 9px;
  font-size: 16px;
}

input,
textarea {
  padding: 11px;
  border: 1px solid #4b5563;
  background: #111827;
  color: white;
}

textarea {
  min-height: 260px;
  resize: vertical;
  font-family:
    "Cascadia Code",
    Consolas,
    monospace;
  line-height: 1.45;
}

#receiverText {
  min-height: 500px;
}

button {
  margin-top: 8px;
  padding: 13px;
  border: 0;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

.green {
  background: #059669;
}

.blue {
  background: #2563eb;
}

.gray {
  background: #374151;
}

.red {
  background: #7f1d1d;
}

.active {
  background: #2563eb;
}

.inactive {
  background: #374151;
}

.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.grid3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.status {
  padding: 12px;
  border-radius: 9px;
  background: #111827;
  color: #d1d5db;
  white-space: pre-wrap;
  line-height: 1.5;
}

.connected {
  color: #86efac;
}

.disconnected {
  color: #fca5a5;
}

.meta {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}

.metaBox {
  padding: 10px;
  border-radius: 9px;
  background: #111827;
}

.metaLabel {
  color: #9ca3af;
  font-size: 12px;
}

.metaValue {
  margin-top: 4px;
  word-break: break-all;
}

.hidden {
  display: none;
}

details summary {
  cursor: pointer;
  font-weight: 700;
}

.count {
  margin-top: 5px;
  text-align: right;
  color: #9ca3af;
  font-size: 12px;
}

.newFlash {
  animation: flash 1.4s ease;
}

@keyframes flash {

  0% {
    border-color: #10b981;
  }

  100% {
    border-color: #374151;
  }
}

@media (max-width: 700px) {

  .grid2,
  .grid3,
  .meta {
    grid-template-columns: 1fr;
  }

  #receiverText {
    min-height: 340px;
  }
}

</style>

</head>


<body>

<div class="wrap">

<h1>GPT → PC</h1>

<p
  id="subtitle"
  class="sub"
>
ChatGPT 코드를 휴대폰에서 PC로 전달합니다.
</p>


<div class="modebar">

<button
  id="sendModeButton"
  class="active"
  onclick="setMode('send')"
>
휴대폰 전송
</button>

<button
  id="receiveModeButton"
  class="inactive"
  onclick="setMode('receive')"
>
PC 실시간 수신
</button>

</div>


<!-- ========================================================
     SEND MODE
========================================================= -->

<div id="sendMode">

<div class="card">

<button
  class="green"
  onclick="clipboardAndSend()"

클립보드 읽고 PC로 전송
</button>

  class="blue"
  onclick="readClipboard()"
>
클립보드만 가져오기
</button>

<div
  id="sendStatus"
  class="status"
  style="margin-top:10px"
>
준비됨
</div>

</div>


<div class="card">

<label>
전송할 코드
</label>

<textarea
  id="sendText"
  placeholder="ChatGPT 코드 블록에서 복사 버튼을 누른 다음 위의 전송 버튼을 누르세요."
></textarea>

<div
  id="sendCount"
  class="count"
>
0자
</div>


<label>
GitHub 저장 파일
</label>

<input
  id="sendPath"

>


<div class="grid2">

<button
  class="gray"
  onclick="sendCurrentText()"
>
현재 내용 전송
</button>

<button
  class="red"
  onclick="clearSendText()"
>
내용 지우기
</button>

</div>

</div>

</div>


<!-- ========================================================
     RECEIVE MODE
========================================================= -->

<div
  id="receiveMode"
  class="hidden"
>

<div
  id="receiverCard"

>

<div
  id="receiveStatus"

수신 대기 중...
</div>


<div
  class="meta"
  style="margin-top:10px"
>

<div class="metaBox">

<div class="metaLabel">
파일
</div>

<div
  id="receiveFile"
  class="metaValue"
>
-
</div>

</div>


<div class="metaBox">

<div class="metaLabel">
길이
</div>

<div
  id="receiveLength"
  class="metaValue"
>
-
</div>

</div>


<div class="metaBox">

<div class="metaLabel">
마지막 수신
</div>

<div
  id="receiveTime"
  class="metaValue"
>
-
</div>

</div>

</div>


<label>
PC에 도착한 최신 코드
</label>

<textarea
  id="receiverText"

<button

클립보드 복사

자동 확인 중지

</div>


<!-- ========================================================
     SETTINGS
========================================================= -->

<div class="card">

<details id="settingsDetails">

<summary>
GitHub 연결 설정
</summary>


<label>
GitHub 사용자명
</label>

<input
  id="owner"
  value="joo-ec"
>


<label>
Private Repository
</label>

<input
  id="repo"
  value="gpt-to-pc-data"
>

Branch
</label>

<input
  id="branch"
  value="main"
>


<label>
Fine-grained PAT
</label>

<input
  id="token"
  type="password"

>


<div class="grid2">

<button
  class="blue"
  onclick="saveSettings()"
>
설정 저장
</button>

<button
  class="gray"
  onclick="testConnection()"
>
연결 테스트
</button>

</div>

<button
  class="red"
  onclick="clearToken()"
>
이 기기에 저장된 토큰 삭제

<script>

const API_VERSION =
  '2026-03-10';

const POLL_INTERVAL =
  5000;


let currentMode =
  'send';

let monitoring =
  true;

let monitorTimer =
  null;

let lastSha =
  '';

let firstReceiverLoad =
  true;


const sendText =
  document.getElementById(
    'sendText'
  );

const sendStatus =
  document.getElementById(
    'sendStatus'
  );

const sendCount =
  document.getElementById(
    'sendCount'
  );

const receiverText =
  document.getElementById(
    'receiverText'
  );

const receiveStatus =
  document.getElementById(
    'receiveStatus'
  );


function setSendStatus(text) {

  sendStatus.textContent =
    text;
}


function setReceiveStatus(text) {

  receiveStatus.textContent =
    text;
}


function updateSendCount() {

  sendCount.textContent =
    sendText.value.length
      .toLocaleString()
    +
    '자';
}


sendText.addEventListener(
  'input',
  updateSendCount
);


function loadSettings() {

  document.getElementById(
    'owner'
  ).value =
    localStorage.getItem(
      'githubOwner'
    ) || 'joo-ec';


  document.getElementById(
    'repo'
  ).value =
    localStorage.getItem(
      'githubRepo'
    ) || 'gpt-to-pc-data';


  document.getElementById(
    'branch'
  ).value =
    localStorage.getItem(
      'githubBranch'
    ) || 'main';


  document.getElementById(
    'sendPath'
  ).value =
    localStorage.getItem(
      'githubPath'
    ) || 'inbox/latest.ps1';


  document.getElementById(
    'token'
  ).value =
    localStorage.getItem(
      'githubToken'
    ) || '';
}


function saveSettings() {

  const owner =
    document
      .getElementById('owner')
      .value
      .trim();

  const repo =
    document
      .getElementById('repo')
      .value
      .trim();

  const branch =
    document
      .getElementById('branch')
      .value
      .trim();

  const path =
    document
      .getElementById('sendPath')
      .value
      .trim();

  const token =
    document
      .getElementById('token')
      .value
      .trim();


  localStorage.setItem(
    'githubOwner',
    owner
  );

  localStorage.setItem(
    'githubRepo',
    repo
  );

  localStorage.setItem(
    'githubBranch',
    branch
  );

  localStorage.setItem(
    'githubPath',
    path
  );

  localStorage.setItem(
    'githubToken',
    token
  );


  if (
    currentMode === 'receive'
  ) {

    setReceiveStatus(
      '설정을 저장했습니다.\n연결 확인 중...'
    );

    checkLatestFile(
      true
    );

  } else {

    setSendStatus(
      'GitHub 설정을 저장했습니다.'
    );
  }
}


function getSettings() {

  const settings = {

    owner:
      document
        .getElementById('owner')
        .value
        .trim(),

    repo:
      document
        .getElementById('repo')
        .value
        .trim(),

    branch:
      document
        .getElementById('branch')
        .value
        .trim(),

    path:
      document
        .getElementById('sendPath')
        .value
        .trim(),

    token:
      document
        .getElementById('token')
        .value
        .trim()
  };


  if (!settings.owner) {
    throw new Error(
      'GitHub 사용자명이 없습니다.'
    );
  }

  if (!settings.repo) {
    throw new Error(
      'Repository가 없습니다.'
    );
  }

  if (!settings.branch) {
    throw new Error(
      'Branch가 없습니다.'
    );
  }

  if (!settings.path) {
    throw new Error(
      '파일 경로가 없습니다.'
    );
  }

  if (!settings.token) {
    throw new Error(
      'GitHub PAT를 입력하세요.'
    );
  }


  return settings;
}


function headers(token) {

  return {

    'Accept':
      'application/vnd.github+json',

    'Authorization':
      'Bearer ' + token,

    'X-GitHub-Api-Version':
      API_VERSION
  };
}


function apiUrl(
  owner,
  repo,
  path
) {

  const encodedPath =
    path
      .split('/')
      .map(
        value =>
          encodeURIComponent(
            value
          )
      )
      .join('/');


  return (
    'https://api.github.com/repos/' +
    encodeURIComponent(owner) +
    '/' +
    encodeURIComponent(repo) +
    '/contents/' +
    encodedPath
  );
}


function utf8ToBase64(text) {

  const bytes =
    new TextEncoder()
      .encode(
        text
      );


  let binary =
    '';


  const size =
    0x8000;


  for (
    let i = 0;
    i < bytes.length;
    i += size
  ) {

    const chunk =
      bytes.subarray(
        i,
        Math.min(
          i + size,
          bytes.length
        )
      );


    binary +=
      String.fromCharCode.apply(
        null,
        chunk
      );
  }


  return btoa(
    binary
  );
}


function base64ToUtf8(value) {

  const cleaned =
    String(value || '')
      .replace(
        /\s/g,
        ''
      );


  const binary =
    atob(
      cleaned
    );


  const bytes =
    new Uint8Array(
      binary.length
    );


  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(
        i
      );
  }


  return new TextDecoder(
    'utf-8'
  ).decode(
    bytes
  );
}


/* ==========================================================
   MODE
========================================================== */

function setMode(mode) {

  currentMode =
    mode;


  const sendMode =
    document.getElementById(
      'sendMode'
    );

  const receiveMode =
    document.getElementById(
      'receiveMode'
    );

  const sendButton =
    document.getElementById(
      'sendModeButton'
    );

  const receiveButton =
    document.getElementById(
      'receiveModeButton'
    );


  if (
    mode === 'receive'
  ) {

    sendMode.classList.add(
      'hidden'
    );

    receiveMode.classList.remove(
      'hidden'
    );

    sendButton.className =
      'inactive';

    receiveButton.className =
      'active';

    document.getElementById(
      'subtitle'
    ).textContent =
      '휴대폰에서 전송된 코드를 PC에서 자동으로 보여줍니다.';


    startMonitoring();


  } else {

    receiveMode.classList.add(
      'hidden'
    );

    sendMode.classList.remove(
      'hidden'
    );

    receiveButton.className =
      'inactive';

    sendButton.className =
      'active';

    document.getElementById(
      'subtitle'
    ).textContent =
      'ChatGPT 코드를 휴대폰에서 PC로 전달합니다.';
  }


  const url =
    new URL(
      location.href
    );


  url.searchParams.set(
    'mode',
    mode
  );


  history.replaceState(
    {},
    '',
    url
  );
}


/* ==========================================================
   SEND
========================================================== */

async function readClipboard() {

  try {

    if (
      !navigator.clipboard ||
      !navigator.clipboard.readText
    ) {

      throw new Error(
        '클립보드 읽기를 지원하지 않습니다.'
      );
    }


    const text =
      await navigator
        .clipboard
        .readText();


    if (!text) {

      throw new Error(
        '클립보드가 비어 있습니다.'
      );
    }


    sendText.value =
      text;


    updateSendCount();


    setSendStatus(
      '클립보드 읽기 완료\n' +
      text.length.toLocaleString() +
      '자'
    );


    return text;

  } catch (error) {

    setSendStatus(
      '클립보드 읽기 실패\n\n' +
      error.message
    );

    throw error;
  }
}


async function clipboardAndSend() {

  try {

    const text =
      await readClipboard();


    await sendToGitHub(
      text
    );

  } catch (error) {

    if (
      !String(
        error.message
      ).includes(
        '클립보드'
      )
    ) {

      setSendStatus(
        '전송 실패\n\n' +
        error.message
      );
    }
  }
}


async function sendCurrentText() {

  try {

    const text =
      sendText.value;


    if (!text.trim()) {

      throw new Error(
        '전송할 내용이 없습니다.'
      );
    }


    await sendToGitHub(
      text
    );

  } catch (error) {

    setSendStatus(
      '전송 실패\n\n' +
      error.message
    );
  }
}


function waitMs(ms) {

  return new Promise(
    resolve => {
      setTimeout(
        resolve,
        ms
      );
    }
  );
}


async function readGitHubResponseError(
  response
) {

  let message =
    response.status +
    ' ' +
    response.statusText;


  try {

    const body =
      await response.json();


    if (
      body &&
      body.message
    ) {

      message =
        body.message;
    }

  } catch {
  }


  return message;
}


async function getLatestGitHubFileSha(
  s,
  url
) {

  const response =
    await fetch(
      url +
      '?ref=' +
      encodeURIComponent(
        s.branch
      ) +
      '&_=' +
      Date.now(),
      {
        method:
          'GET',

        cache:
          'no-store',

        headers:
          headers(
            s.token
          )
      }
    );


  if (
    response.status === 404
  ) {

    return null;
  }


  if (!response.ok) {

    const detail =
      await readGitHubResponseError(
        response
      );


    throw new Error(
      'GitHub 파일 확인 실패: ' +
      detail
    );
  }


  const data =
    await response.json();


  return (
    data.sha ||
    null
  );
}


function isGitHubShaConflict(
  statusCode,
  message
) {

  const text =
    String(
      message || ''
    ).toLowerCase();


  return (
    statusCode === 409 ||
    statusCode === 422 ||
    text.includes(
      'does not match'
    ) ||
    (
      text.includes(
        'sha'
      ) &&
      text.includes(
        'match'
      )
    )
  );
}


async function sendToGitHub(text) {

  const s =
    getSettings();


  localStorage.setItem(
    'githubPath',
    s.path
  );


  const url =
    apiUrl(
      s.owner,
      s.repo,
      s.path
    );


  const maxAttempts =
    5;


  let lastError =
    null;


  for (
    let attempt = 1;
    attempt <= maxAttempts;
    attempt++
  ) {

    try {

      setSendStatus(
        'GitHub 최신 상태 확인 중...\n\n' +
        '전송 시도 ' +
        attempt +
        '/' +
        maxAttempts
      );


      // ------------------------------------------------------
      // 핵심:
      // 매 PUT 직전에 항상 최신 SHA를 다시 읽는다.
      // ------------------------------------------------------

      const currentSha =
        await getLatestGitHubFileSha(
          s,
          url
        );


      const body = {

        message:
          'GPT to PC ' +
          new Date()
            .toISOString(),

        content:
          utf8ToBase64(
            text
          ),

        branch:
          s.branch
      };


      if (currentSha) {

        body.sha =
          currentSha;
      }


      setSendStatus(
        'PC로 전송 중...\n\n' +
        text.length.toLocaleString() +
        '자\n\n' +
        '시도 ' +
        attempt +
        '/' +
        maxAttempts
      );


      const response =
        await fetch(
          url,
          {
            method:
              'PUT',

            cache:
              'no-store',

            headers: {

              ...headers(
                s.token
              ),

              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify(
                body
              )
          }
        );


      // ------------------------------------------------------
      // 성공
      // ------------------------------------------------------

      if (response.ok) {

        const result =
          await response.json();


        let message =
          'PC 전송 완료!\n\n' +
          s.path +
          '\n' +
          text.length.toLocaleString() +
          '자\n\n' +
          'Commit: ' +
          result.commit.sha.substring(
            0,
            7
          );


        if (attempt > 1) {

          message +=
            '\n\nGitHub 충돌 자동 복구 완료' +
            '\n' +
            attempt +
            '회차에 성공';
        }


        setSendStatus(
          message
        );


        return result;
      }


      // ------------------------------------------------------
      // 실패 내용 읽기
      // ------------------------------------------------------

      const detail =
        await readGitHubResponseError(
          response
        );


      const conflict =
        isGitHubShaConflict(
          response.status,
          detail
        );


      // ------------------------------------------------------
      // SHA 충돌이면 최신 SHA를 다시 읽고 재시도
      // ------------------------------------------------------

      if (
        conflict &&
        attempt < maxAttempts
      ) {

        lastError =
          new Error(
            detail
          );


        setSendStatus(
          'GitHub 동시 수정 충돌 감지\n\n' +
          detail +
          '\n\n' +
          '최신 SHA를 다시 읽은 뒤 자동 재시도합니다.\n' +
          '시도 ' +
          attempt +
          '/' +
          maxAttempts
        );


        // PC Runner가 result/*를 쓰는 순간과 겹칠 수 있으므로
        // 재시도할수록 조금 더 기다린다.
        await waitMs(
          400 * attempt
        );


        continue;
      }


      // SHA 충돌이 아닌 실제 오류
      throw new Error(
        detail
      );


    } catch (error) {

      lastError =
        error;


      const message =
        String(
          error &&
          error.message
            ? error.message
            : error
        );


      const retryable =
        isGitHubShaConflict(
          0,
          message
        ) ||
        message
          .toLowerCase()
          .includes(
            'failed to fetch'
          );


      if (
        retryable &&
        attempt < maxAttempts
      ) {

        setSendStatus(
          '일시적인 GitHub 충돌/통신 오류\n\n' +
          message +
          '\n\n' +
          '자동 재시도합니다.\n' +
          '시도 ' +
          attempt +
          '/' +
          maxAttempts
        );


        await waitMs(
          500 * attempt
        );


        continue;
      }


      throw error;
    }
  }


  throw (
    lastError ||
    new Error(
      'GitHub 전송을 완료하지 못했습니다.'
    )
  );
}

function clearSendText() {

  sendText.value =
    '';

  updateSendCount();

  setSendStatus(
    '내용을 지웠습니다.'
  );
}


/* ==========================================================
   PC RECEIVER
========================================================== */

function startMonitoring() {

  monitoring =
    true;


  document.getElementById(
    'monitorButton'
  ).textContent =
    '자동 확인 중지';


  document.getElementById(
    'monitorButton'
  ).className =
    'red';


  if (monitorTimer) {

    clearInterval(
      monitorTimer
    );
  }


  checkLatestFile(
    true
  );


  monitorTimer =
    setInterval(
      () => {

        if (
          monitoring &&
          currentMode === 'receive'
        ) {

          checkLatestFile(
            false
          );
        }

      },
      POLL_INTERVAL
    );
}


function stopMonitoring() {

  monitoring =
    false;


  if (monitorTimer) {

    clearInterval(
      monitorTimer
    );

    monitorTimer =
      null;
  }


  document.getElementById(
    'monitorButton'
  ).textContent =
    '자동 확인 시작';


  document.getElementById(
    'monitorButton'
  ).className =
    'green';


  setReceiveStatus(
    '자동 확인이 중지되었습니다.'
  );
}


function toggleMonitoring() {

  if (monitoring) {

    stopMonitoring();

  } else {

    startMonitoring();
  }
}


function checkNow() {

  checkLatestFile(
    true
  );
}


async function checkLatestFile(
  manual
) {

  try {

    const s =
      getSettings();


    const url =
      apiUrl(
        s.owner,
        s.repo,
        s.path
      );


    if (
      manual ||
      firstReceiverLoad
    ) {

      setReceiveStatus(
        'GitHub 확인 중...'
      );
    }


    const response =
      await fetch(
        url +
        '?ref=' +
        encodeURIComponent(
          s.branch
        ) +
        '&_=' +
        Date.now(),
        {
          cache:
            'no-store',

          headers:
            headers(
              s.token
            )
        }
      );


    if (!response.ok) {

      throw new Error(
        'GitHub 응답 ' +
        response.status
      );
    }


    const data =
      await response.json();


    const changed =
      data.sha !== lastSha;


    if (
      changed ||
      firstReceiverLoad
    ) {

      const text =
        base64ToUtf8(
          data.content
        );


      receiverText.value =
        text;


      document.getElementById(
        'receiveFile'
      ).textContent =
        data.path;


      document.getElementById(
        'receiveLength'
      ).textContent =
        text.length
          .toLocaleString()
        +
        '자';


      document.getElementById(
        'receiveTime'
      ).textContent =
        new Date()
          .toLocaleTimeString();


      if (
        !firstReceiverLoad &&
        changed
      ) {

        setReceiveStatus(
          '● 새 코드 도착!\n' +
          new Date()
            .toLocaleString()
        );


        const card =
          document.getElementById(
            'receiverCard'
          );


        card.classList.remove(
          'newFlash'
        );


        void card.offsetWidth;


        card.classList.add(
          'newFlash'
        );


        try {

          if (
            'Notification' in window &&
            Notification.permission ===
              'granted'
          ) {

            new Notification(
              'GPT → PC',
              {
                body:
                  '새 코드가 도착했습니다.'
              }
            );
          }

        } catch {
        }


      } else {

        setReceiveStatus(
          '● 연결됨\n' +
          '5초마다 자동 확인'
        );
      }


      lastSha =
        data.sha;


      firstReceiverLoad =
        false;


    } else {

      setReceiveStatus(
        '● 연결됨\n' +
        '새 코드 대기 중\n' +
        new Date()
          .toLocaleTimeString()
      );
    }


  } catch (error) {

    setReceiveStatus(
      '연결 오류\n\n' +
      error.message +
      '\n\nGitHub 연결 설정을 확인하세요.'
    );


    document.getElementById(
      'settingsDetails'
    ).open =
      true;
  }
}


async function copyReceiverText() {

  const text =
    receiverText.value;


  if (!text) {

    setReceiveStatus(
      '복사할 코드가 없습니다.'
    );

    return;
  }


  try {

    await navigator
      .clipboard
      .writeText(
        text
      );


    setReceiveStatus(
      '클립보드 복사 완료\n' +
      text.length
        .toLocaleString()
      +
      '자'
    );


  } catch {

    receiverText.focus();

    receiverText.select();


    setReceiveStatus(
      '자동 복사가 제한되었습니다.\n' +
      '코드를 전체 선택했습니다. Ctrl+C를 누르세요.'
    );
  }
}


/* ==========================================================
   CONNECTION
========================================================== */

async function testConnection() {

  try {

    saveSettings();


    const s =
      getSettings();


    const status =
      currentMode ===
      'receive'
        ? setReceiveStatus
        : setSendStatus;


    status(
      'GitHub 연결 테스트 중...'
    );


    const url =
      'https://api.github.com/repos/' +
      encodeURIComponent(
        s.owner
      ) +
      '/' +
      encodeURIComponent(
        s.repo
      );


    const response =
      await fetch(
        url,
        {
          headers:
            headers(
              s.token
            )
        }
      );


    if (!response.ok) {

      throw new Error(
        'GitHub 응답 ' +
        response.status
      );
    }


    const repo =
      await response.json();


    status(
      'GitHub 연결 성공\n\n' +
      repo.full_name +
      '\nPrivate: ' +
      repo.private +
      '\nBranch: ' +
      repo.default_branch
    );


  } catch (error) {

    const status =
      currentMode ===
      'receive'
        ? setReceiveStatus
        : setSendStatus;


    status(
      'GitHub 연결 실패\n\n' +
      error.message
    );
  }
}


function clearToken() {

  localStorage.removeItem(
    'githubToken'
  );


  document.getElementById(
    'token'
  ).value =
    '';


  if (
    currentMode ===
    'receive'
  ) {

    setReceiveStatus(
      '이 PC에서 저장된 토큰을 삭제했습니다.'
    );

  } else {

    setSendStatus(
      '휴대폰에서 저장된 토큰을 삭제했습니다.'
    );
  }
}


/* ==========================================================
   START
========================================================== */

loadSettings();

updateSendCount();


const requestedMode =
  new URLSearchParams(
    location.search
  ).get(
    'mode'
  );


if (
  requestedMode ===
  'receive'
) {

  setMode(
    'receive'
  );

} else {

  setMode(
    'send'
  );
}


if (
  'serviceWorker' in navigator
) {

  navigator
    .serviceWorker
    .register(
      './sw.js'
    )
    .then(
      registration =>
        registration.update()
    )
    .catch(
      () => {}
    );
}
