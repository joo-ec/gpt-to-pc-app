<!doctype html>

<html lang="ko">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta name="theme-color" content="#111827">

<title>GPT → PC 실행 결과</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 14px;
  background: #111827;
  color: #f9fafb;
  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
}

.wrap {
  max-width: 850px;
  margin: auto;
}

.card {
  padding: 14px;
  margin-bottom: 12px;
  border-radius: 14px;
  border: 1px solid #374151;
  background: #1f2937;
}

.status {
  padding: 14px;
  border-radius: 10px;
  background: #111827;
  white-space: pre-wrap;
  line-height: 1.6;
  font-weight: 700;
}

.success {
  color: #86efac;
}

.failed {
  color: #fca5a5;
}

.running {
  color: #fde68a;
}

label {
  display: block;
  margin: 10px 0 5px;
  color: #9ca3af;
  font-size: 13px;
}

input,
textarea,
button {
  width: 100%;
  border-radius: 9px;
  font-size: 15px;
}

input,
textarea {
  padding: 10px;
  background: #111827;
  color: white;
  border: 1px solid #4b5563;
}

textarea {
  min-height: 220px;
  resize: vertical;
  font-family: Consolas, monospace;
}

#errorText {
  min-height: 280px;
}

button {
  margin-top: 8px;
  padding: 13px;
  border: 0;
  color: white;
  font-weight: 700;
}

.green {
  background: #059669;
}

.blue {
  background: #2563eb;
}

.gray {
  background: #374151;
}

.red {
  background: #7f1d1d;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.userbox {
  padding: 12px;
  border-radius: 10px;
  background: #111827;
}

@media(max-width:600px) {

  .grid {
    grid-template-columns: 1fr;
  }
}

</style>

</head>


<body>

<div class="wrap">

<h1>
PC 실행 결과
</h1>


<div class="card">

<div class="userbox">

<label>
현재 User ID
</label>

<input
  id="userId"
  placeholder="예: sv40"
>

<button
  class="blue"
  onclick="saveUser()"
>
User ID 적용
</button>

</div>

</div>


<div class="card">

<div
  id="status"
  class="status"
>
결과 확인 중...
</div>

<button
  class="blue"
  onclick="loadResult()"
>
지금 새로고침
</button>

</div>


<div class="card">

<label>
오류
</label>

<textarea
  id="errorText"
  readonly
></textarea>

<div class="grid">

<button
  class="red"
  onclick="copyError()"
>
오류 복사
</button>

<button
  class="green"
  onclick="copyErrorAndChatGPT()"
>
오류 복사 후 ChatGPT 열기
</button>

</div>

</div>


<div class="card">

<label>
PowerShell 출력
</label>

<textarea
  id="outputText"
  readonly
></textarea>

<button
  class="gray"
  onclick="copyAll()"
>
전체 결과 복사
</button>

</div>


<div class="card">

<details>

<summary>
GitHub 설정
</summary>

<label>
GitHub 사용자명
</label>

<input
  id="owner"
  value="joo-ec"
>

<label>
Repository
</label>

<input
  id="repo"
  value="gpt-to-pc-data"
>

<label>
Branch
</label>

<input
  id="branch"
  value="main"
>

<label>
PAT
</label>

<input
  id="token"
  type="password"
>

<button
  class="blue"
  onclick="saveGitHub()"
>
GitHub 설정 저장
</button>

</details>

</div>


<button
  class="gray"
  onclick="location.href='./'"
>
전송 화면
</button>

</div>


<script>

const $ =
  id =>
    document.getElementById(id);


function cleanUserId(value) {

  return String(
    value || ''
  )
    .trim()
    .toLowerCase()
    .replace(
      /[^a-z0-9._-]/g,
      '-'
    )
    .replace(
      /-+/g,
      '-'
    )
    .replace(
      /^[-.]+|[-.]+$/g,
      ''
    );
}


function loadSettings() {

  $('userId').value =
    localStorage.getItem(
      'bridgeUserId'
    ) || 'user1';


  $('owner').value =
    localStorage.getItem(
      'githubOwner'
    ) || 'joo-ec';


  $('repo').value =
    localStorage.getItem(
      'githubRepo'
    ) || 'gpt-to-pc-data';


  $('branch').value =
    localStorage.getItem(
      'githubBranch'
    ) || 'main';


  $('token').value =
    localStorage.getItem(
      'githubToken'
    ) || '';
}


function saveUser() {

  let value =
    cleanUserId(
      $('userId').value
    );


  if (!value) {
    value = 'user1';
  }


  $('userId').value =
    value;


  localStorage.setItem(
    'bridgeUserId',
    value
  );


  loadResult();
}


function saveGitHub() {

  localStorage.setItem(
    'githubOwner',
    $('owner').value.trim()
  );

  localStorage.setItem(
    'githubRepo',
    $('repo').value.trim()
  );

  localStorage.setItem(
    'githubBranch',
    $('branch').value.trim()
  );

  localStorage.setItem(
    'githubToken',
    $('token').value.trim()
  );


  loadResult();
}


function config() {

  const userId =
    cleanUserId(
      $('userId').value
    );


  const result = {

    userId,

    owner:
      $('owner').value.trim(),

    repo:
      $('repo').value.trim(),

    branch:
      $('branch').value.trim(),

    token:
      $('token').value.trim()
  };


  if (!result.userId) {
    throw new Error(
      'User ID를 입력하세요.'
    );
  }


  if (
    !result.owner ||
    !result.repo ||
    !result.token
  ) {

    throw new Error(
      'GitHub 설정을 확인하세요.'
    );
  }


  return result;
}


function headers(token) {

  return {

    Accept:
      'application/vnd.github+json',

    Authorization:
      'Bearer ' + token,

    'X-GitHub-Api-Version':
      '2022-11-28'
  };
}


function apiUrl(
  c,
  path
) {

  return (
    'https://api.github.com/repos/' +
    encodeURIComponent(c.owner) +
    '/' +
    encodeURIComponent(c.repo) +
    '/contents/' +
    path
      .split('/')
      .map(encodeURIComponent)
      .join('/') +
    '?ref=' +
    encodeURIComponent(c.branch) +
    '&_=' +
    Date.now()
  );
}


function decodeContent(value) {

  const binary =
    atob(
      String(value || '')
        .replace(/\s/g, '')
    );


  const bytes =
    new Uint8Array(
      binary.length
    );


  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);
  }


  return new TextDecoder(
    'utf-8'
  ).decode(bytes);
}


async function readText(
  c,
  relativePath
) {

  const response =
    await fetch(
      apiUrl(
        c,
        relativePath
      ),
      {
        cache:
          'no-store',

        headers:
          headers(
            c.token
          )
      }
    );


  if (
    response.status === 404
  ) {

    return '';
  }


  if (!response.ok) {

    throw new Error(
      'GitHub ' +
      response.status
    );
  }


  const data =
    await response.json();


  return decodeContent(
    data.content
  );
}


async function loadResult() {

  try {

    const c =
      config();


    const base =
      'users/' +
      c.userId +
      '/result/';


    const resultText =
      await readText(
        c,
        base +
        'latest.json'
      );


    if (!resultText) {

      $('status').className =
        'status';


      $('status').textContent =
        'User ID: ' +
        c.userId +
        '\n\n아직 실행 결과가 없습니다.';


      $('errorText').value =
        '';


      $('outputText').value =
        '';


      return;
    }


    const result =
      JSON.parse(
        resultText
      );


    if (
      result.status ===
      'running'
    ) {

      $('status').className =
        'status running';


      $('status').textContent =
        '⏳ 실행 중\n\n' +
        'User: ' +
        c.userId;


      return;
    }


    const output =
      await readText(
        c,
        base +
        'output.txt'
      );


    const errorText =
      await readText(
        c,
        base +
        'error.txt'
      );


    $('outputText').value =
      output;


    $('errorText').value =
      errorText;


    const success =
      result.status ===
      'success';


    $('status').className =
      'status ' +
      (
        success
          ? 'success'
          : 'failed'
      );


    $('status').textContent =
      (
        success
          ? '✅ 실행 성공'
          : '❌ 실행 실패'
      ) +
      '\n\nUser: ' +
      c.userId +
      '\nExitCode: ' +
      result.exitCode +
      '\n완료: ' +
      (
        result.endedAt
          ? new Date(
              result.endedAt
            ).toLocaleString()
          : '-'
      ) +
      '\n실행시간: ' +
      (
        result.durationSeconds ??
        '-'
      ) +
      '초\nSHA: ' +
      (
        result.inputSha
          ? result.inputSha.substring(
              0,
              8
            )
          : '-'
      );
  }
  catch (error) {

    $('status').className =
      'status failed';


    $('status').textContent =
      '결과 조회 오류\n\n' +
      error.message;
  }
}


async function copyError() {

  if (!$('errorText').value) {

    alert(
      '오류가 없습니다.'
    );

    return;
  }


  await navigator
    .clipboard
    .writeText(
      $('errorText').value
    );
}


async function copyErrorAndChatGPT() {

  let text =
    $('errorText').value;


  if (!text) {

    text =
      $('outputText').value;
  }


  if (!text) {

    alert(
      '복사할 결과가 없습니다.'
    );

    return;
  }


  await navigator
    .clipboard
    .writeText(text);


  window.open(
    'https://chatgpt.com/',
    '_blank'
  );
}


async function copyAll() {

  await navigator
    .clipboard
    .writeText(
      '=== ERROR ===\n' +
      $('errorText').value +
      '\n\n=== OUTPUT ===\n' +
      $('outputText').value
    );
}


loadSettings();

loadResult();

setInterval(
  loadResult,
  5000
);

</script>

</body>

</html>
