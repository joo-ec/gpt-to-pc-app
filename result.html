<!doctype html>

<html lang="ko">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta name="theme-color" content="#111827">

<title>GPT → PC 실행 결과</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 14px;
  background: #111827;
  color: #f9fafb;
  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
}

.wrap {
  max-width: 850px;
  margin: auto;
}

h1 {
  margin: 4px 0;
}

.sub {
  color: #9ca3af;
}

.card {
  margin-bottom: 12px;
  padding: 14px;
  background: #1f2937;
  border: 1px solid #374151;
  border-radius: 14px;
}

.status {
  padding: 13px;
  background: #111827;
  border-radius: 10px;
  white-space: pre-wrap;
}

.success {
  color: #86efac;
}

.failed {
  color: #fca5a5;
}

.running {
  color: #fde68a;
}

label {
  display: block;
  margin: 10px 0 5px;
  color: #9ca3af;
  font-size: 13px;
}

textarea,
input,
button {
  width: 100%;
  border-radius: 9px;
  font-size: 15px;
}

textarea,
input {
  border: 1px solid #4b5563;
  background: #111827;
  color: white;
  padding: 10px;
}

textarea {
  min-height: 220px;
  font-family: Consolas, monospace;
  resize: vertical;
}

#errorText {
  min-height: 300px;
}

button {
  margin-top: 8px;
  padding: 13px;
  border: 0;
  color: white;
  font-weight: 700;
}

.green {
  background: #059669;
}

.blue {
  background: #2563eb;
}

.gray {
  background: #374151;
}

.red {
  background: #7f1d1d;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

details summary {
  cursor: pointer;
  font-weight: 700;
}

@media (max-width: 600px) {

  .grid {
    grid-template-columns: 1fr;
  }
}

</style>

</head>

<body>

<div class="wrap">

<h1>PC 실행 결과</h1>

<p class="sub">
PC에서 실행한 PowerShell 결과를 자동으로 확인합니다.
</p>


<div class="card">

<div
  id="status"
  class="status"
>
GitHub 확인 중...
</div>

<button
  class="blue"
  onclick="loadResult(true)"
>
지금 새로고침
</button>

</div>


<div class="card">

<label>
PowerShell 오류
</label>

<textarea
  id="errorText"
  readonly
></textarea>


<div class="grid">

<button
  class="red"
  onclick="copyError()"
>
오류 복사
</button>

<button
  class="green"
  onclick="copyErrorAndOpenChatGPT()"
>
오류 복사 후 ChatGPT 열기
</button>

</div>

</div>


<div class="card">

<label>
PowerShell 출력
</label>

<textarea
  id="outputText"
  readonly
></textarea>

<button
  class="gray"
  onclick="copyAll()"
>
전체 실행 결과 복사
</button>

</div>


<div class="card">

<details>

<summary>
GitHub 설정
</summary>

<label>
GitHub 사용자명
</label>

<input
  id="owner"
  value="joo-ec"
>

<label>
Repository
</label>

<input
  id="repo"
  value="gpt-to-pc-data"
>

<label>
Branch
</label>

<input
  id="branch"
  value="main"
>

<label>
PAT
</label>

<input
  id="token"
  type="password"
>

<button
  class="blue"
  onclick="saveSettings()"
>
설정 저장
</button>

</details>

</div>


<button
  class="gray"
  onclick="location.href='./'"
>
GPT → PC 전송 화면
</button>

</div>


<script>

const POLL =
  5000;

const $ =
  id =>
    document.getElementById(id);


function loadSettings() {

  $('owner').value =
    localStorage.getItem(
      'githubOwner'
    ) || 'joo-ec';

  $('repo').value =
    localStorage.getItem(
      'githubRepo'
    ) || 'gpt-to-pc-data';

  $('branch').value =
    localStorage.getItem(
      'githubBranch'
    ) || 'main';

  $('token').value =
    localStorage.getItem(
      'githubToken'
    ) || '';
}


function saveSettings() {

  localStorage.setItem(
    'githubOwner',
    $('owner').value.trim()
  );

  localStorage.setItem(
    'githubRepo',
    $('repo').value.trim()
  );

  localStorage.setItem(
    'githubBranch',
    $('branch').value.trim()
  );

  localStorage.setItem(
    'githubToken',
    $('token').value.trim()
  );

  loadResult(true);
}


function cfg() {

  const result = {

    owner:
      $('owner').value.trim(),

    repo:
      $('repo').value.trim(),

    branch:
      $('branch').value.trim(),

    token:
      $('token').value.trim()
  };

  if (
    !result.owner ||
    !result.repo ||
    !result.token
  ) {

    throw new Error(
      'GitHub 설정을 먼저 입력하세요.'
    );
  }

  return result;
}


function headers(token) {

  return {

    Accept:
      'application/vnd.github+json',

    Authorization:
      'Bearer ' + token,

    'X-GitHub-Api-Version':
      '2026-03-10'
  };
}


function urlFor(
  c,
  path
) {

  return (
    'https://api.github.com/repos/' +
    encodeURIComponent(c.owner) +
    '/' +
    encodeURIComponent(c.repo) +
    '/contents/' +
    path
      .split('/')
      .map(encodeURIComponent)
      .join('/') +
    '?ref=' +
    encodeURIComponent(c.branch) +
    '&_=' +
    Date.now()
  );
}


function decodeContent(value) {

  const binary =
    atob(
      String(value || '')
        .replace(/\s/g, '')
    );

  const bytes =
    new Uint8Array(
      binary.length
    );

  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);
  }

  return new TextDecoder(
    'utf-8'
  ).decode(bytes);
}


async function getText(
  c,
  path
) {

  const response =
    await fetch(
      urlFor(c, path),
      {
        cache:
          'no-store',

        headers:
          headers(c.token)
      }
    );

  if (response.status === 404) {
    return '';
  }

  if (!response.ok) {

    throw new Error(
      'GitHub ' +
      response.status
    );
  }

  const data =
    await response.json();

  return decodeContent(
    data.content
  );
}


async function loadResult(
  manual
) {

  try {

    const c =
      cfg();


    if (manual) {

      $('status').textContent =
        'PC 실행 결과 확인 중...';
    }


    const resultText =
      await getText(
        c,
        'result/latest.json'
      );


    if (!resultText) {

      $('status').textContent =
        '아직 PC 실행 결과가 없습니다.';

      return;
    }


    const result =
      JSON.parse(
        resultText
      );


    const output =
      await getText(
        c,
        'result/output.txt'
      );


    const errorText =
      await getText(
        c,
        'result/error.txt'
      );


    $('outputText').value =
      output;

    $('errorText').value =
      errorText;


    let status =
      '상태: ' +
      result.status +
      '\n';


    if (
      result.exitCode !==
      undefined
    ) {

      status +=
        'ExitCode: ' +
        result.exitCode +
        '\n';
    }


    if (result.endedAt) {

      status +=
        '완료: ' +
        new Date(
          result.endedAt
        ).toLocaleString() +
        '\n';
    }


    if (
      result.durationSeconds !==
      undefined
    ) {

      status +=
        '실행시간: ' +
        result.durationSeconds +
        '초\n';
    }


    if (result.inputSha) {

      status +=
        'SHA: ' +
        result.inputSha
          .substring(0, 8);
    }


    $('status').textContent =
      status;

    $('status').className =
      'status ' +
      (
        result.status ===
        'success'
          ? 'success'
          : result.status ===
            'running'
            ? 'running'
            : 'failed'
      );


  } catch (error) {

    $('status').textContent =
      '결과 확인 오류\n\n' +
      error.message;
  }
}


async function copyError() {

  const text =
    $('errorText').value;

  if (!text) {

    alert(
      '복사할 오류가 없습니다.'
    );

    return;
  }

  await navigator
    .clipboard
    .writeText(text);

  alert(
    'PC 오류를 복사했습니다.'
  );
}


async function copyErrorAndOpenChatGPT() {

  let text =
    $('errorText').value;


  if (!text) {

    text =
      $('outputText').value;
  }


  if (!text) {

    alert(
      '복사할 실행 결과가 없습니다.'
    );

    return;
  }


  await navigator
    .clipboard
    .writeText(text);


  window.open(
    'https://chatgpt.com/',
    '_blank'
  );
}


async function copyAll() {

  const combined =
    '=== PC ERROR ===\n' +
    $('errorText').value +
    '\n\n' +
    '=== PC OUTPUT ===\n' +
    $('outputText').value;


  await navigator
    .clipboard
    .writeText(
      combined
    );

  alert(
    '전체 실행 결과를 복사했습니다.'
  );
}


loadSettings();

loadResult(true);

setInterval(
  () => loadResult(false),
  POLL
);

</script>

</body>

</html>
